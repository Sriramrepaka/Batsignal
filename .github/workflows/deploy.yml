name: Build ESP32 Firmware & Deploy Web Installer

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build ESP-IDF Project
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: latest
          target: esp32
          path: 'code/BATSIGNAL_HFP'

      - name: Prepare Web Distribution Folder
        run: |
          mkdir -p public
          # Copy compiled binaries from the ESP-IDF build directory
          cp code/BATSIGNAL_HFP/build/bootloader/bootloader.bin public/
          cp code/BATSIGNAL_HFP/build/partition_table/partition-table.bin public/
          cp code/BATSIGNAL_HFP/build/BATSIGNAL_HFP.bin public/
          
          # Copy web installer frontend files
          cp index.html public/
          cp manifest.json public/

      - name: Upload Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4